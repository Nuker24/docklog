services:
  postgres:
    image: postgres:16-alpine
    container_name: docklog-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: docklog
      POSTGRES_PASSWORD: docklog
      POSTGRES_DB: docklog
    volumes:
      - docklog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docklog -d docklog"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  docklog_pgdata:
